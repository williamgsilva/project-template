name: Scorecard

# OpenSSF Scorecard: nota de segurança da cadeia de suprimentos do repositório
# (branch protection, actions fixadas, permissões, dependências, revisão de código…).
# Resultado na aba Security e em https://scorecard.dev (repos públicos).

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write # publicar resultados no scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Repositório privado: mude para false (publicação só funciona em repos públicos).
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
