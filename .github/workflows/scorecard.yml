name: Scorecard

# OpenSSF Scorecard: nota de segurança da cadeia de suprimentos do repositório
# (branch protection, actions fixadas, permissões, dependências, revisão de código…).
# Resultado na aba Security e em https://scorecard.dev (repos públicos).

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write # publicar resultados no scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Repositório privado: mude para false (publicação só funciona em repos públicos).
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
