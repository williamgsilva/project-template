name: Release

# release-please lê os Conventional Commits da main e mantém um PR de release aberto
# (versão SemVer + CHANGELOG). Ao fazer merge desse PR, cria a tag e o GitHub Release.
# Em seguida, este workflow anexa o SBOM e a assinatura (keyless, Sigstore) ao release.
#
# Requer (Settings → Actions → General): "Allow GitHub Actions to create and approve pull requests".
# Os checks do PR de release ficam retidos ("action_required") por virem do bot: aprove-os no PR
# ("Approve and run workflows"). Para evitar isso, use um token próprio:
#   token: ${{ secrets.RELEASE_PLEASE_TOKEN }}   (no passo do release-please)
# Verificar a assinatura do SBOM baixado do release:
#   cosign verify-blob --bundle sbom.spdx.json.sigstore.json \
#     --certificate-identity "https://github.com/<dono>/<repo>/.github/workflows/release.yml@refs/heads/main" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com sbom.spdx.json

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sbom:
    name: SBOM e assinatura
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # anexar arquivos ao release
      id-token: write # assinatura keyless (OIDC → Sigstore)
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gerar SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Assinar o SBOM
        run: cosign sign-blob --yes --bundle sbom.spdx.json.sigstore.json sbom.spdx.json
      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" sbom.spdx.json sbom.spdx.json.sigstore.json --repo "$GITHUB_REPOSITORY"
      # TODO(lang): quando houver imagem/artefato, gerar SBOM dele e assinar com `cosign sign`
      # (imagem) ou `cosign sign-blob` (binário), e publicar provenance (SLSA).
