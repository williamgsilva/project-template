name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # toda segunda: pega CVEs novas em deps já existentes
  workflow_dispatch:

permissions:
  contents: read

# Actions fixadas por SHA (tags são mutáveis). O Dependabot atualiza SHA e comentário.
jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repos de organização exigem GITLEAKS_LICENSE (gratuita): https://gitleaks.io
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trivy:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # envia resultados para a aba Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Um único scan: gera o SARIF e falha em HIGH/CRITICAL (vulnerabilidade, segredo,
      # configuração insegura ou licença restritiva, ex.: GPL/AGPL em dependência).
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy.sarif

  actionlint:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (binário verificado por checksum)
        run: |
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "$file" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${file}"
          echo "${ACTIONLINT_SHA256}  ${file}" | sha256sum --check --strict
          tar -xzf "$file" actionlint
          ./actionlint -color

  # TODO(lang): adicionar CodeQL (SAST gratuito para repos públicos) para a linguagem da stack.
