# Atualizações automáticas de dependências.
# TODO(lang): adicionar o ecossistema da stack (pip, npm, gomod, maven, gradle, nuget, cargo…).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

