# Atualizações automáticas de dependências.
# TODO(lang): adicionar o ecossistema da stack (pip, npm, gomod, maven, gradle, nuget, cargo…).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Espera 7 dias após a publicação de uma versão nova (não vale para atualizações de
    # segurança): reduz o risco de adotar uma versão maliciosa recém-publicada.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # Hooks do .pre-commit-config.yaml (fixados por SHA, com a tag em "# frozen:")
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  # Habilite quando existir Dockerfile:
  # - package-ecosystem: docker
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   commit-message:
  #     prefix: build
