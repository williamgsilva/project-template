# Atualizações automáticas de dependências.
version: 2
updates:
  # Dependências Python (pyproject.toml + uv.lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        dependency-type: development
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore


  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Espera 7 dias após a publicação de uma versão nova (não vale para atualizações de
    # segurança): reduz o risco de adotar uma versão maliciosa recém-publicada.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # Hooks do .pre-commit-config.yaml (fixados por SHA, com a tag em "# frozen:")
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  # Habilite quando existir Dockerfile:
  # - package-ecosystem: docker
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   commit-message:
  #     prefix: build
