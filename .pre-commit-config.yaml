# https://pre-commit.com — hooks genéricos (qualquer linguagem).
# Branches lang/* adicionam formatter/linter da stack.
# Hooks fixados por SHA (tags são mutáveis). Atualizar: `pre-commit autoupdate --freeze`
# (o Dependabot também atualiza — ecossistema pre-commit em .github/dependabot.yml)
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# Skills de terceiros são copiadas sem edição (fixadas por SHA): nenhum hook pode alterá-las.
# Ao adotar outra, acrescente a pasta aqui (ver docs/prompts/README.md → Skills de terceiros).
exclude: ^\.claude/skills/(discernment-nudge|security-audit)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # Os 3 corretores abrem o arquivo para escrita mesmo sem nada a corrigir, e o sandbox do
      # Claude Code deixa .claude/ somente leitura: sem o exclude, `make lint` falha dentro dele.
      # Em .claude/, o markdownlint continua checando espaços no fim e a linha final dos .md.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^\.claude/
      - id: end-of-file-fixer
        exclude: ^\.claude/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^\.claude/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Segredos
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # Mensagens de commit (Conventional Commits)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
    hooks:
      - id: markdownlint
        # CHANGELOG.md é gerado pelo release-please (formato próprio, não editar à mão)
        exclude: ^CHANGELOG\.md$

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
